name: LBV Appointment Checker

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: lbv-appointment-checker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run LBV checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LBV_FIRST_NAME: ${{ secrets.LBV_FIRST_NAME }}
          LBV_LAST_NAME: ${{ secrets.LBV_LAST_NAME }}
          LBV_EMAIL: ${{ secrets.LBV_EMAIL }}
        run: |
          python checker.py

      - name: Upload LBV debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lbv-debug
          path: debug/
          if-no-files-found: warn
          retention-days: 3

      - name: Save alert state
        if: always()
        run: |
          if git status --porcelain .state/last_alert.txt | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state/last_alert.txt
            git commit -m "Update LBV alert state"
            git push
          fi
